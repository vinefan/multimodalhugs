  per_device_eval_batch_size: 128
  dataloader_num_workers: 4
  seed: 42

  report_to:
    - wandb
  wandb_project: "multimodalhugs-signclip-popsign"
  wandb_tags: "signclip,popsign,eval,zeroshot,youtube-asl,server,v2t,resume-8048,plus2ep"

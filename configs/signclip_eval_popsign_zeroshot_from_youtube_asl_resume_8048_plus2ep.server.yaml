# Server evaluation config for zero-shot PopSign evaluation using the
# YouTube-ASL SignCLIP model after resuming checkpoint-8048 for two epochs.

model:
  model_name_or_path: "/home/faxu/scratch/signclip/runs/youtube_asl_pretrain_v1_resume_8048_plus2ep/train/checkpoint-16096"

processor:
  processor_name_or_path: "/home/faxu/scratch/signclip/setup/youtube_asl_pretrain_v1/setup/sign_clip_processor"

data:
  dataset_dir: "/home/faxu/scratch/signclip/setup/popsign_pretrain_v1/setup/datasets/default"

training:
  output_dir: "/home/faxu/scratch/signclip/evals/popsign_zeroshot_from_youtube_asl_resume_8048_plus2ep"
  overwrite_output_dir: true
  remove_unused_columns: false
  run_name: "signclip-eval-popsign-zeroshot-youtube-asl-resume-8048-plus2ep"

  do_train: false
  do_eval: true
  run_retrieval_eval: true

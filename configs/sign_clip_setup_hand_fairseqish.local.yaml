# Local setup config for the hand-only SignCLIP run on fairseq-like local metadata.

data:
  dataset_type: "pose2text"
  train_metadata_file: "/Users/fanxu/research/multimodalhugs/data/metadata/sign_clip_pose_fairseqish/train.tsv"
  validation_metadata_file: "/Users/fanxu/research/multimodalhugs/data/metadata/sign_clip_pose_fairseqish/validation.tsv"
  test_metadata_file: "/Users/fanxu/research/multimodalhugs/data/metadata/sign_clip_pose_fairseqish/test.tsv"
  shuffle: true
  max_frames: 128

processor:
  tokenizer_path: "bert-base-uncased"
  text_tokenizer_path: "bert-base-uncased"
  reduce_holistic_poses: false
  skip_frames_stride: null
  pose_components:
    - "LEFT_HAND_LANDMARKS"
    - "RIGHT_HAND_LANDMARKS"

model:
  type: "sign_clip"
  pretrained_text_encoder: "bert-base-uncased"
  text_encoder_type: "bert"
  cls_token_id: 101
  sep_token_id: 102
  pad_token_id: 0

  sign_encoder_type: "bert"
  pretrained_sign_encoder: null

  sign_input_dim: 126
  num_hidden_sign_encoder_layers: 6
  sign_hidden_size: null
  sign_max_position_embeddings: 128
  sign_use_seg_emb: false
  sign_conv1d_layers: 0

  hidden_dropout_prob: 0.1
  attention_probs_dropout_prob: 0.1

  use_projection: true
  projection_dim: 512
  projection_l2_norm: true
  logit_scale_init_value: 2.6592
  max_logit_scale: 100.0

  freeze_sign_encoder: false
  freeze_text_encoder: false
  freeze_sign_projection: false
  freeze_text_projection: false

  output_hidden_states: false
  return_dict: true

setup:
  output_dir: "/Users/fanxu/research/multimodalhugs/output/sign_clip_setup_hand_fairseqish"
  do_dataset: true
  do_processor: true
  do_model: true
  update_config: false

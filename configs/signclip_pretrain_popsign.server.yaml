# Server training config for PopSign SignCLIP pretraining.
# Reference style:
# - fairseq/MMPT pretraining: projects/retri/signclip_v1/baseline_sp_b768.yaml
# This is a first practical MMH server baseline, not a final tuned recipe.

model:
  model_name_or_path: "/home/faxu/scratch/signclip/setup/popsign_pretrain_v1/setup/model"

processor:
  processor_name_or_path: "/home/faxu/scratch/signclip/setup/popsign_pretrain_v1/setup/sign_clip_processor"

data:
  dataset_dir: "/home/faxu/scratch/signclip/setup/popsign_pretrain_v1/setup/datasets/default"
  train_ordering_strategy: "default"

training:
  output_dir: "/home/faxu/scratch/signclip/runs/popsign_pretrain_v1"
  overwrite_output_dir: true
  remove_unused_columns: false
  run_name: "signclip-pretrain-popsign-v1"

  do_train: true
  do_eval: true
  run_retrieval_eval: false
  retrieval_eval_direction: "v2t"

  # Conservative starting point for first server runs.
  # Increase once H100/H200 memory headroom is measured under the full pipeline.
  per_device_train_batch_size: 256
  per_device_eval_batch_size: 128
  gradient_accumulation_steps: 1

  learning_rate: 5.0e-5
  weight_decay: 0.0
  num_train_epochs: 25
  warmup_steps: 1000

  logging_strategy: "steps"
  logging_steps: 100
  eval_strategy: "epoch"
  save_strategy: "epoch"
  save_total_limit: 2

  dataloader_num_workers: 4
  seed: 42

  report_to:
    - wandb
  wandb_project: "multimodalhugs-signclip-popsign"
  wandb_tags: "signclip,popsign,pretrain,server,reduced_holistic,v1"

# Direction 1 extended run: local contrastive negatives on each DDP rank.

model:
  model_name_or_path: "/home/faxu/scratch/signclip/setup/youtube_asl_pretrain_v1/setup/model"
  use_distributed_negatives: false

processor:
  processor_name_or_path: "/home/faxu/scratch/signclip/setup/youtube_asl_pretrain_v1/setup/sign_clip_processor"

data:
  dataset_dir: "/home/faxu/scratch/signclip/setup/youtube_asl_pretrain_v1/setup/datasets/default"
  train_ordering_strategy: "default"

training:
  output_dir: "/home/faxu/scratch/signclip/runs/youtube_asl_pretrain_multigpu_local_negatives_5000steps"
  overwrite_output_dir: true
  remove_unused_columns: false
  run_name: "signclip-pretrain-youtube-asl-multigpu-local-negatives-5000steps"

  do_train: true
  do_eval: true
  run_retrieval_eval: false

  per_device_train_batch_size: 128
  per_device_eval_batch_size: 64
  gradient_accumulation_steps: 1
  dataloader_drop_last: true

  learning_rate: 5.0e-5
  lr_scheduler_type: "linear"
  weight_decay: 0.0
  max_steps: 5000
  warmup_steps: 500

  logging_strategy: "steps"
  logging_steps: 100
  eval_strategy: "steps"
  eval_steps: 500
  save_strategy: "steps"
  save_steps: 1000
  save_total_limit: 5

  dataloader_num_workers: 1
  seed: 42

  report_to:
    - wandb
  wandb_project: "multimodalhugs-signclip-youtube-asl"
  wandb_tags: "signclip,youtube-asl,pretrain,multigpu,local-negatives,direction-1,5000steps"

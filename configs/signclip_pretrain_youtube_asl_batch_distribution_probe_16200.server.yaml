# Single-GPU diagnostic run for batch-distribution statistics around epoch boundaries.

model:
  model_name_or_path: "/home/faxu/scratch/signclip/setup/youtube_asl_pretrain_v1/setup/model"

processor:
  processor_name_or_path: "/home/faxu/scratch/signclip/setup/youtube_asl_pretrain_v1/setup/sign_clip_processor"

data:
  dataset_dir: "/home/faxu/scratch/signclip/setup/youtube_asl_pretrain_v1/setup/datasets/default"
  train_ordering_strategy: "default"

training:
  output_dir: "/home/faxu/scratch/signclip/runs/youtube_asl_batch_distribution_probe_16200"
  overwrite_output_dir: true
  remove_unused_columns: false
  run_name: "signclip-pretrain-youtube-asl-batch-distribution-probe-16200"

  do_train: true
  do_eval: true
  run_retrieval_eval: false

  per_device_train_batch_size: 128
  per_device_eval_batch_size: 64
  gradient_accumulation_steps: 1

  learning_rate: 5.0e-5
  lr_scheduler_type: "linear"
  weight_decay: 0.0
  max_steps: 16200
  num_train_epochs: 10
  warmup_steps: 1000

  logging_strategy: "steps"
  logging_steps: 100
  eval_strategy: "steps"
  eval_steps: 1000
  save_strategy: "no"

  batch_distribution_probe_path: "batch_distribution_probe.jsonl"
  batch_distribution_probe_steps: 1
  batch_distribution_probe_window_size: 100
  batch_distribution_probe_include_hashes: true

  dataloader_num_workers: 4
  seed: 42

  report_to:
    - wandb
  wandb_project: "multimodalhugs-signclip-youtube-asl"
  wandb_tags: "signclip,youtube-asl,pretrain,diagnostic,batch-distribution,epoch-boundary,single-gpu,16200steps"

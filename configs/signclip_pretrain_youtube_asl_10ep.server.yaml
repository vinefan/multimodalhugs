# Fresh 10-epoch YouTube-ASL SignCLIP pretraining run.
# The linear learning-rate schedule is defined once over the complete run.

model:
  model_name_or_path: "/home/faxu/scratch/signclip/setup/youtube_asl_pretrain_v1/setup/model"

processor:
  processor_name_or_path: "/home/faxu/scratch/signclip/setup/youtube_asl_pretrain_v1/setup/sign_clip_processor"

data:
  dataset_dir: "/home/faxu/scratch/signclip/setup/youtube_asl_pretrain_v1/setup/datasets/default"
  train_ordering_strategy: "default"

training:
  output_dir: "/home/faxu/scratch/signclip/runs/youtube_asl_pretrain_v3_10ep"
  overwrite_output_dir: true
  remove_unused_columns: false
  run_name: "signclip-pretrain-youtube-asl-v3-10ep"

  do_train: true
  do_eval: true
  run_retrieval_eval: false
  retrieval_eval_direction: "v2t"

  per_device_train_batch_size: 128
  per_device_eval_batch_size: 64
  gradient_accumulation_steps: 1

  learning_rate: 5.0e-5
  lr_scheduler_type: "linear"
  weight_decay: 0.0
  num_train_epochs: 10
  warmup_steps: 1000

  logging_strategy: "steps"
  logging_steps: 100
  eval_strategy: "steps"
  eval_steps: 1000
  save_strategy: "epoch"
  save_total_limit: 10

  dataloader_num_workers: 4
  seed: 42

  report_to:
    - wandb
  wandb_project: "multimodalhugs-signclip-youtube-asl"
  wandb_tags: "signclip,youtube-asl,pretrain,server,reduced_holistic,v3,sentence-level,fresh,10ep"

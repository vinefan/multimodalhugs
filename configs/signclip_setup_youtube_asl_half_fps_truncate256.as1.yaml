# YouTube-ASL setup for the half-frame-rate, truncate-to-256 experiment.
# Dataset construction deliberately keeps overlength samples. The processor
# first keeps every second pose frame and then truncates the result to 256.

data:
  dataset_type: "pose2text"
  train_metadata_file: "/home/xf/data/signclip_pretrain/as1_softmax_b32_10ep/metadata/train.tsv"
  validation_metadata_file: "/home/xf/data/signclip_pretrain/as1_softmax_b32_10ep/metadata/validation.tsv"
  test_metadata_file: "/home/xf/data/signclip_pretrain/as1_softmax_b32_10ep/metadata/test.tsv"
  shuffle: true
  max_frames: null

processor:
  tokenizer_path: "/home/xf/data/models/bert-base-cased-full"
  text_tokenizer_path: "/home/xf/data/models/bert-base-cased-full"
  reduce_holistic_poses: true
  skip_frames_stride: 2
  max_frames: 256
  pose_components: null

model:
  type: "sign_clip"
  pretrained_text_encoder: "/home/xf/data/models/bert-base-cased-full"
  text_encoder_type: "bert"
  cls_token_id: 101
  sep_token_id: 102
  pad_token_id: 0
  sign_encoder_type: "bert"
  pretrained_sign_encoder: null
  sign_input_dim: 534
  num_hidden_sign_encoder_layers: 6
  sign_hidden_size: null
  sign_max_position_embeddings: 258
  sign_use_seg_emb: false
  sign_conv1d_layers: 0
  hidden_dropout_prob: 0.1
  attention_probs_dropout_prob: 0.1
  use_projection: true
  projection_dim: 512
  projection_l2_norm: true
  logit_scale_init_value: 2.6592
  max_logit_scale: 100.0
  freeze_sign_encoder: false
  freeze_text_encoder: false
  freeze_sign_projection: false
  freeze_text_projection: false
  output_hidden_states: false
  return_dict: true

setup:
  output_dir: "/home/xf/data/signclip_pretrain/as1_softmax_b32_half_fps_truncate256_10ep/setup_youtube_asl"
  do_dataset: true
  do_processor: true
  do_model: true
  update_config: false

# Multi-GPU YouTube-ASL SignCLIP pretraining config.
# This run starts from the setup model and relies on distributed negatives
# in SignCLIPModel when launched with torchrun/DDP.

model:
  model_name_or_path: "/home/faxu/scratch/signclip/setup/youtube_asl_pretrain_v1/setup/model"

processor:
  processor_name_or_path: "/home/faxu/scratch/signclip/setup/youtube_asl_pretrain_v1/setup/sign_clip_processor"

data:
  dataset_dir: "/home/faxu/scratch/signclip/setup/youtube_asl_pretrain_v1/setup/datasets/default"
  train_ordering_strategy: "default"

training:
  output_dir: "/home/faxu/scratch/signclip/runs/youtube_asl_pretrain_v2_multigpu"
  overwrite_output_dir: true
  remove_unused_columns: false
  run_name: "signclip-pretrain-youtube-asl-v2-multigpu"

  do_train: true
  do_eval: true
  run_retrieval_eval: false
  retrieval_eval_direction: "v2t"

  per_device_train_batch_size: 128
  per_device_eval_batch_size: 64
  gradient_accumulation_steps: 1
  dataloader_drop_last: true

  learning_rate: 5.0e-5
  weight_decay: 0.0
  num_train_epochs: 20
  warmup_steps: 1000

  logging_strategy: "steps"
  logging_steps: 100
  eval_strategy: "steps"
  eval_steps: 500
  save_strategy: "steps"
  save_steps: 10000
  save_total_limit: 3

  dataloader_num_workers: 2
  seed: 42

  report_to:
    - wandb
  wandb_project: "multimodalhugs-signclip-youtube-asl"
  wandb_tags: "signclip,youtube-asl,pretrain,server,reduced_holistic,v2,sentence-level,multigpu,distributed-negatives"
